{{ $p := partial "book/profile.html" . }}<section class="document-section" id="hobbies" aria-labelledby="hobbies-title"><h2 id="hobbies-title">{{ i18n "hobbies_heading" }}</h2><p class="hobbies-intro">{{ i18n "hobbies_intro" }}</p><div class="hobbies-carousel" role="region" aria-roledescription="{{ i18n "carousel" }}" aria-label="{{ i18n "hobbies_heading" }}"><div class="hobbies-track" id="hobbies-track" tabindex="0" aria-label="{{ i18n "hobbies_keyboard" }}">{{ range $i, $h := $p.hobbies }}<figure class="hobby" role="group" aria-roledescription="{{ i18n "slide" }}" aria-label="{{ add $i 1 }} / {{ len $p.hobbies }} · {{ .title }}" data-title="{{ .title }}"><a class="figure-link" href="{{ .image }}" aria-label="{{ i18n "full_image" }} · {{ .title }}"><img src="{{ .image }}" width="{{ .image_width }}" height="{{ .image_height }}" loading="lazy" alt="{{ .image_alt }}"></a><figcaption><h3>{{ .title }}</h3><p>{{ .text }}</p></figcaption></figure>{{ end }}</div><div class="hobby-controls" hidden><button type="button" data-direction="-1" aria-controls="hobbies-track" aria-label="{{ i18n "previous_slide" }}">←</button><div class="hobby-dots" role="group" aria-label="{{ i18n "choose_slide" }}">{{ range $i, $h := $p.hobbies }}<button type="button" data-slide="{{ $i }}" aria-controls="hobbies-track" aria-label="{{ .title }}"><span aria-hidden="true"></span></button>{{ end }}</div><button type="button" data-direction="1" aria-controls="hobbies-track" aria-label="{{ i18n "next_slide" }}">→</button><p class="hobby-position" aria-live="polite" aria-atomic="true"></p></div><p class="hobbies-hint">{{ i18n "hobbies_swipe" }}</p></div></section>
