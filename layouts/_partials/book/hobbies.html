{{ $p := partial "book/profile.html" . }}
<section class="document-section" id="hobbies" aria-labelledby="hobbies-title">
  <h2 id="hobbies-title">{{ i18n "hobbies_heading" }}</h2>
  <div class="hobbies-carousel" role="region" aria-roledescription="{{ i18n "carousel" }}" aria-label="{{ i18n "hobbies_heading" }}">
    <div class="hobbies-track" id="hobbies-track" tabindex="0" aria-label="{{ i18n "hobbies_keyboard" }}">
      {{ range $i, $h := $p.hobbies }}
      <figure class="hobby" role="group" aria-roledescription="{{ i18n "slide" }}" aria-label="{{ add $i 1 }} / {{ len $p.hobbies }} · {{ .title }}" data-title="{{ .title }}">
        <a class="figure-link" href="{{ .image }}" aria-label="{{ i18n "full_image" }} · {{ .title }}"><img src="{{ .image }}" width="{{ .image_width }}" height="{{ .image_height }}" loading="lazy" alt="{{ .image_alt }}"></a>
        <figcaption><h3>{{ .title }}</h3><p>{{ .text }}</p></figcaption>
        {{ with .photos }}
        <template class="hobby-gallery">{{ range . }}<a href="{{ .image }}" data-thumbnail="{{ .thumbnail | default .image }}" data-alt="{{ .image_alt }}" data-caption="{{ .text }}"></a>{{ end }}</template>
        <noscript><ul>{{ range . }}<li><a href="{{ .image }}">{{ .text }}</a></li>{{ end }}</ul></noscript>
        {{ end }}
      </figure>
      {{ end }}
    </div>
    <div class="hobby-controls" hidden>
      <button type="button" data-direction="-1" aria-controls="hobbies-track" aria-label="{{ i18n "previous_slide" }}">←</button>
      <div class="hobby-dots" role="group" aria-label="{{ i18n "choose_slide" }}">{{ range $i, $h := $p.hobbies }}<button type="button" data-slide="{{ $i }}" aria-controls="hobbies-track" aria-label="{{ .title }}">{{ i18n (printf "hobby_%s" .id) }}</button>{{ end }}</div>
      <button type="button" data-direction="1" aria-controls="hobbies-track" aria-label="{{ i18n "next_slide" }}">→</button>
      <p class="hobby-position" aria-live="polite" aria-atomic="true"></p>
    </div>
    <div class="photo-controls" hidden>
      <button type="button" data-photo-direction="-1" aria-label="{{ i18n "photo_previous" }}">←</button>
      <button type="button" data-photo-toggle data-pause="{{ i18n "photo_pause" }}" data-resume="{{ i18n "photo_resume" }}">{{ i18n "photo_pause" }}</button>
      <button type="button" data-photo-direction="1" aria-label="{{ i18n "photo_next" }}">→</button>
      <span class="photo-position hobby-position"></span>
    </div>
  </div>
</section>
