{{ if .image }}<figure class="project-figure"><a class="figure-link" href="{{ .image }}" aria-label="{{ i18n "full_image" }} · {{ .title }}"><img src="{{ .image }}" width="{{ .image_width }}" height="{{ .image_height }}" alt="{{ .image_alt }}" loading="lazy"></a><figcaption>{{ .image_caption }}</figcaption></figure>{{ end }}
{{ with .architecture }}<figure class="architecture-figure" aria-label="{{ $.image_caption }}"><div class="architecture-flow">{{ with .scope }}<p class="architecture-scope">{{ . }}</p>{{ end }}<div class="architecture-pair architecture-clients">{{ range .clients }}<div class="architecture-node"><strong>{{ .title }}</strong><span>{{ .role }}</span></div>{{ end }}</div><div class="architecture-connector"><span aria-hidden="true">↓</span> {{ .bridge }}</div><div class="architecture-node architecture-host"><strong>{{ .host.title }}</strong><span>{{ .host.role }}</span></div><div class="architecture-connector" aria-hidden="true">↓</div><div class="architecture-node"><strong>{{ .application.title }}</strong><span>{{ .application.role }}</span></div><div class="architecture-connector" aria-hidden="true">↙ &nbsp; ↘</div><div class="architecture-pair">{{ range slice .domain .infrastructure }}<div class="architecture-node"><strong>{{ .title }}</strong><span>{{ .role }}</span></div>{{ end }}</div><div class="feature-grid">{{ range .features }}<div class="feature"><strong>{{ .title }}</strong><code>{{ .implementation }}</code><p>{{ .detail }}</p></div>{{ end }}</div></div><figcaption>{{ $.image_caption }}</figcaption></figure>{{ end }}
{{ with .model }}<figure class="architecture-figure" aria-label="{{ $.image_caption }}"><div class="mediation-flow">{{ range $i, $node := . }}{{ if $i }}<span class="model-arrow" aria-hidden="true">→</span>{{ end }}<div class="architecture-node">{{ if reflect.IsMap $node }}<strong>{{ $node.title }}</strong><span>{{ $node.detail }}</span>{{ else }}{{ $node }}{{ end }}</div>{{ end }}</div>{{ with $.dimensions }}<div class="evaluation-dimensions">{{ range . }}<div class="architecture-node">{{ . }}</div>{{ end }}</div><p class="evaluation-criteria">{{ $.criteria }}</p>{{ end }}<figcaption>{{ $.image_caption }}</figcaption></figure>{{ end }}
{{ if .image_pending }}<p class="figure-pending">{{ i18n "image_pending" }}</p>{{ end }}
