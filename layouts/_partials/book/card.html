<article class="entry overview-entry" id="{{ .Params.id }}"><div class="entry-body"><div class="entry-heading"><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Params.icon }}<img class="application-icon" src="{{ . }}" width="64" height="64" alt="" loading="lazy">{{ end }}</h3><span class="period">{{ .Params.period }}</span></div>{{ partial "book/meta.html" .Params }}<p class="summary">{{ .Params.summary }}</p><div class="method-list">{{ range .Params.methods }}<span>{{ . }}</span>{{ end }}</div><a class="text-link" href="{{ .RelPermalink }}">{{ i18n "details" }}</a></div></article>
