<dialog id="image-viewer" class="image-viewer" aria-label="{{ i18n "full_image" }}" aria-describedby="image-viewer-caption"><div class="image-viewer-toolbar"><p id="image-viewer-caption"></p><div class="image-viewer-controls" role="group" aria-label="{{ i18n "image_zoom_controls" }}"><button type="button" data-zoom="-1" aria-label="{{ i18n "image_zoom_out" }}" title="{{ i18n "image_zoom_out" }}">−</button><output class="image-viewer-scale" aria-live="polite" aria-atomic="true">100%</output><button type="button" data-zoom="1" aria-label="{{ i18n "image_zoom_in" }}" title="{{ i18n "image_zoom_in" }}">＋</button><button type="button" data-reset>{{ i18n "image_reset" }}</button></div><button class="image-viewer-close" type="button" aria-label="{{ i18n "image_close" }}" title="{{ i18n "image_close" }}" autofocus>×</button></div><div class="image-viewer-stage" tabindex="0" aria-label="{{ i18n "image_zoom_controls" }}"><img src="/assets/images/hobby-photography.jpg" alt="" loading="lazy" draggable="false"><p class="image-viewer-error" hidden>{{ i18n "image_error" }}</p></div><p class="image-viewer-hint">{{ i18n "image_zoom_hint" }}</p></dialog>
