{{ $i := .item }}<article class="entry" id="{{ $i.id }}"><div class="entry-body"><div class="entry-heading"><h3>{{ if .education }}<img class="university-emblem" src="/assets/images/whu-emblem.png" alt="{{ i18n "university_emblem" }}" width="160" height="160" loading="lazy">{{ end }}{{ $i.title }}</h3>{{ if or $i.period $i.supervisor }}{{ partial "book/period.html" $i }}{{ end }}</div>{{ partial "book/meta.html" $i }}{{ with $i.bullets | default $i.highlights }}<ul class="entry-points">{{ range . }}<li>{{ . | markdownify }}</li>{{ end }}</ul>{{ end }}</div></article>
