############################
## HUGO MODULES
## Install or uninstall themes and plugins here.
## Docs: https://gohugo.io/hugo-modules/
############################

imports:
  - path: github.com/HugoBlox/kit/modules/blox

# Install any Hugo Blox within the `hugo-blox/blox/` folder
mounts:
  - source: hugo-blox/blox/community
    target: layouts/_partials/blox/community/
    files:
      - '**.html'
  - source: hugo-blox/blox/all-access
    target: layouts/_partials/blox/
    files:
      - '**.html'
  - source: hugo-blox/blox
    target: assets/dist/community/blox/
    files:
      - '**.css'
  - source: layouts
    target: layouts
  - source: assets
    target: assets
  - source: assets/images
    target: static/assets/images
    files: [book-paper-rough.png, emotion-experiment.png, favicon-avatar.png, gamelibrary-icon.png, hobby-cycling.jpg, hobby-fitness.jpg, hobby-games.jpg, hobby-photography.jpg, portrait-lifestyle.jpg, whu-emblem.png, 'photography/**', 'hobbies/**']
  - source: assets/fonts
    target: static/assets/fonts
    files: [noto-serif-sc.woff2, noto-sans-sc.woff2, NotoSerifSC-OFL.txt, NotoSansSC-OFL.txt]
  - source: assets/css/academic.css
    target: static/assets/css/academic.css
  - source: assets/css/book.css
    target: static/assets/css/book.css
  - source: assets/js
    target: static/assets/js
    files: [hobbies.js, images.js, reveal.js]
  - source: tokens.css
    target: static/tokens.css
  - source: files/job-resume-public.pdf
    target: static/files/job-resume-public.pdf
  - source: static
    target: static
