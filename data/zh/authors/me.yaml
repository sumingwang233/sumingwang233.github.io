bio: |-
  我毕业于武汉大学心理学本科，目前在心理中心参与情绪调节与自我验证研究。

  我的工作涉及行为实验设计、担任主试与数据收集，以及心理测量与数据分析。

  工作之余，我会投入时间与精力探索个人兴趣，包括个人软件与独立游戏的设计及 AI 辅助开发。
