academic_interests:
- id: emotion-self-concept
  title: 情绪调节、自我概念与心理测量
  text: 围绕当前的情绪调节与自我验证研究，结合行为实验与心理测量，理解情绪调节动机及自我概念对情绪体验的影响
- id: game-psychology
  title: 游戏心理学
  text: 关注玩家动机、情绪体验与自我调节，长期希望在中国大陆发展游戏心理学这一学科方向。尝试结合行为实验、心理测量与软件原型，研究游戏中的互动反馈和奖励机制如何影响行为选择
- id: bci-cognitive-neuroscience
  title: 脑机接口与认知神经科学
  text: 对脑机接口和认知神经科学保持兴趣，已有初步接触，希望进一步理解认知过程及其神经机制
