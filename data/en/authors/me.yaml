bio: I graduated with a bachelor's degree in psychology from Wuhan University and currently contribute to emotion regulation and self-verification research at its Mental Health and Education Center. My work spans behavioral experiments, psychological measurement and data analysis, alongside the design and AI-assisted development of personal software and game prototypes
tagline: Personal homepage
motto: Be Water, my friend
interests_text: My interests include emotion regulation, self-concept and psychological measurement, as well as player motivation, emotional experience and self-regulation in games. I aim to combine behavioral experiments, measurement and software prototypes to study how interactive feedback and rewards shape behavioral choices
