name: Validate and publish homepage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          python -m pip install fonttools==4.66.1 brotli==1.2.0 PyMuPDF==1.27.2 PyYAML==6.0.3 Pillow==11.3.0
      - name: Refresh public font subsets
        run: python scripts/prepare_assets.py
      - name: Check public data
        run: python scripts/validate.py
      - name: Build HugoBlox Academic-CV
        run: pnpm run build
      - name: Generate CV PDFs and check browser behavior
        run: pnpm run verify
      - name: Check generated privacy and links
        run: python scripts/validate.py --site public
      - name: Save review previews
        uses: actions/upload-artifact@v7
        with:
          name: homepage-review
          # Restrict hidden-file uploads to these generated public previews.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/previews/*.png
            public/files/cv-*.pdf
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
